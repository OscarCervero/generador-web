    <section>
      <h1>Formulario de Contacto</h1>
      <p>Si deseas colaborar en algún proyecto o ponerte en contacto conmigo, escribeme un mensaje a mi correo electrónico:</p>

      <form action="mailto:uo295432@uniovi.es" method="post" enctype="text/plain">
        <p>
          <label>
            <span>Mensaje:</span>
            <textarea name="mensaje" rows="5" required title="Mensaje" aria-label="Mensaje"></textarea>
          </label>
        </p>

        <p>
          <button type="submit">Enviar Mensaje</button>
        </p>
      </form>
    </section>
  </main>

  <footer></footer>
