<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Canal directo para colaboraciones o consultas técnicas.">
  <title>Contacto | Lucía Álvarez</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/contacto.css">
  <script src="js/layout.js" defer></script>
</head>
<body>
  <header></header>

  <main>
    <section>
      <h1>Enviar Consulta</h1>
      <p>Puedes escribirme si te interesa colaborar en proyectos de arquitectura web o consultoría:</p>

      <form action="mailto:lucia.alvarez@ejemplo.com" method="post" enctype="text/plain">
        <p>
          <label>
            <span>Descripción de la propuesta:</span>
            <textarea name="mensaje" rows="5" required title="Mensaje" aria-label="Mensaje"></textarea>
          </label>
        </p>

        <p>
          <button type="submit">Enviar Correo</button>
        </p>
      </form>
    </section>
  </main>

  <footer></footer>
</body>
</html>
